<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | studentsjob.work</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Variables */
        :root {
            --primary: #6366f1;
            --accent: #10b981;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --background: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden; /* Enforces no scrolling */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Subtle minimal background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center -10%, #e0e7ff 0%, transparent 60%);
            z-index: -1;
        }

        /* Header */
        .navbar {
            width: 100%;
            padding: 3vh 2rem;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand span {
            color: var(--primary);
        }

        /* Main Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1.5rem;
            width: 100%;
            max-width: 600px;
        }

        .illustration-section {
            width: 100%;
            max-width: 220px;
            margin-bottom: 4vh;
        }

        /* Typography */
        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5vh;
            letter-spacing: -0.03em;
        }

        p.subtitle {
            font-size: clamp(0.875rem, 2vw, 1rem);
            color: var(--text-muted);
            margin-bottom: 4vh;
            line-height: 1.5;
            max-width: 400px;
        }

        /* Timer Styles (Minimal) */
        .timer-wrapper {
            margin-bottom: 4vh;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: clamp(0.5rem, 2vw, 1rem);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 50px;
        }

        .time-box span {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .time-box label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.5rem;
        }

        .colon {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            color: #cbd5e1;
            line-height: 1;
            margin-bottom: 1rem;
        }

        /* Form Styles */
        .notify-form {
            display: flex;
            width: 100%;
            max-width: 380px;
            position: relative;
            flex-shrink: 0;
        }

        .notify-form input {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: rgba(255, 255, 255, 0.8);
        }

        .notify-form input:focus {
            border-color: var(--primary);
        }

        .notify-form button {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .notify-form button:hover { opacity: 0.9; }

        /* Footer */
        .social-footer {
            padding: 3vh;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-shrink: 0;
        }

        .social-footer a {
            color: #94a3b8;
            transition: color 0.2s;
            display: flex;
        }

        .social-footer a:hover { color: var(--primary); }

        /* Illustration Animations */
        .anim-float-slow { animation: float 6s ease-in-out infinite; }
        .anim-float-med { animation: float 4s ease-in-out infinite 1s; }
        .anim-float-fast { animation: float 3.5s ease-in-out infinite 0.5s; }
        .anim-pulse { animation: pulse 2s ease-in-out infinite alternate; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="#" class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
            studentsjob<span>.work</span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        
        <!-- Scaled Down SVG Illustration -->
        <div class="illustration-section">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
                <defs>
                    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e0e7ff" />
                        <stop offset="100%" stop-color="#c7d2fe" />
                    </linearGradient>
                    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6366f1" />
                        <stop offset="100%" stop-color="#4f46e5" />
                    </linearGradient>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#6366f1" flood-opacity="0.15"/>
                    </filter>
                    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.1"/>
                    </filter>
                </defs>

                <!-- Abstract Backdrop Shape -->
                <path d="M480,100 C550,160 580,260 540,350 C500,440 380,500 280,480 C180,460 100,340 90,240 C80,140 160,50 250,20 C340,-10 410,40 480,100 Z" fill="url(#bg-grad)" opacity="0.6"/>

                <!-- Laptop Base -->
                <rect x="120" y="380" width="360" height="20" rx="10" fill="#94a3b8" />
                <path d="M 270 400 L 330 400 L 340 410 L 260 410 Z" fill="#cbd5e1" />

                <!-- Laptop Screen -->
                <rect x="150" y="200" width="300" height="180" rx="12" fill="#1e293b" />
                <rect x="160" y="210" width="280" height="150" rx="6" fill="#f8fafc" />
                <rect x="160" y="210" width="280" height="30" rx="6" fill="#f1f5f9" />
                <circle cx="180" cy="225" r="4" fill="#ef4444" />
                <circle cx="195" cy="225" r="4" fill="#f59e0b" />
                <circle cx="210" cy="225" r="4" fill="#10b981" />
                <rect x="230" y="220" width="140" height="10" rx="5" fill="#e2e8f0" />

                <!-- Job Cards -->
                <rect x="175" y="255" width="250" height="40" rx="8" fill="#ffffff" filter="url(#shadow-dark)" />
                <circle cx="200" cy="275" r="10" fill="url(#primary-grad)" />
                <rect x="225" y="265" width="100" height="6" rx="3" fill="#cbd5e1" />
                <rect x="225" y="278" width="60" height="4" rx="2" fill="#94a3b8" />
                <rect x="375" y="267" width="35" height="16" rx="8" fill="#10b981" opacity="0.15" />
                <circle cx="392.5" cy="275" r="3" fill="#10b981" />

                <rect x="175" y="305" width="250" height="40" rx="8" fill="#ffffff" filter="url(#shadow-dark)" />
                <circle cx="200" cy="325" r="10" fill="#f59e0b" />
                <rect x="225" y="315" width="120" height="6" rx="3" fill="#cbd5e1" />
                <rect x="225" y="328" width="70" height="4" rx="2" fill="#94a3b8" />
                <rect x="375" y="317" width="35" height="16" rx="8" fill="#f59e0b" opacity="0.15" />
                <circle cx="392.5" cy="325" r="3" fill="#f59e0b" />

                <!-- Floating Elements -->
                <g class="anim-float-slow" transform="translate(30, -30)">
                    <path d="M120,150 L200,110 L280,150 L200,190 Z" fill="#1e293b" />
                    <path d="M140,160 L140,210 C140,230 260,230 260,210 L260,160 Z" fill="#334155" />
                    <path d="M200,150 L230,220" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
                    <circle cx="230" cy="225" r="5" fill="#f59e0b" />
                </g>

                <g transform="translate(420, 110)">
                    <g class="anim-float-med">
                        <circle cx="40" cy="40" r="30" stroke="url(#primary-grad)" stroke-width="10" fill="#ffffff" fill-opacity="0.6" filter="url(#shadow)"/>
                        <line x1="61" y1="61" x2="90" y2="90" stroke="url(#primary-grad)" stroke-width="12" stroke-linecap="round" />
                        <path d="M 25 25 Q 40 15 55 25" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
                    </g>
                </g>

                <g class="anim-pulse">
                    <circle cx="80" cy="240" r="5" fill="#f59e0b" />
                    <circle cx="140" cy="100" r="3" fill="#10b981" />
                    <circle cx="500" cy="50" r="6" fill="#6366f1" />
                    <circle cx="100" cy="430" r="6" fill="#6366f1" />
                </g>
            </svg>
        </div>

        <h1>Coming <span style="color: var(--primary)">Soon.</span></h1>
        <p class="subtitle">The flexible work platform exclusively for students. We are launching in:</p>

        <!-- Inline Minimal Countdown Timer -->
        <div class="timer-wrapper" id="timer-container">
            <div class="timer">
                <div class="time-box"><span id="days">00</span><label>Days</label></div>
                <div class="colon">:</div>
                <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
                <div class="colon">:</div>
                <div class="time-box"><span id="minutes">00</span><label>Minutes</label></div>
                <div class="colon">:</div>
                <div class="time-box"><span id="seconds">00</span><label>Seconds</label></div>
            </div>
        </div>

        <!-- Form -->
        <form class="notify-form" id="notifyForm">
            <input type="email" id="emailInput" placeholder="Enter student email..." required>
            <button type="submit" id="notifyBtn">Notify Me</button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="social-footer">
        <a href="#" aria-label="Twitter">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/>
            </svg>
        </a>
        <a href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
        </a>
    </footer>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const targetDate = new Date();
            targetDate.setMonth(targetDate.getMonth() + 4);
            const launchDate = targetDate.getTime();

            const timerContainer = document.getElementById("timer-container");
            const elDays = document.getElementById("days");
            const elHours = document.getElementById("hours");
            const elMinutes = document.getElementById("minutes");
            const elSeconds = document.getElementById("seconds");

            function updateTimer() {
                const now = new Date().getTime();
                const distance = launchDate - now;

                if (distance < 0) {
                    timerContainer.innerHTML = "<h3 style='font-size: 1.25rem; color: var(--primary); font-weight: 800;'>We are now live!</h3>";
                    return;
                }

                elDays.innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                elHours.innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                elMinutes.innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                elSeconds.innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
            }

            updateTimer();
            setInterval(updateTimer, 1000);

            const form = document.getElementById("notifyForm");
            const btn = document.getElementById("notifyBtn");
            const input = document.getElementById("emailInput");

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                if (input.value) {
                    btn.innerText = "Subscribed!";
                    btn.style.background = "var(--accent)";
                    input.value = "";
                    setTimeout(() => {
                        btn.innerText = "Notify Me";
                        btn.style.background = "var(--primary)";
                    }, 3000);
                }
            });
        });
    </script>
</body>
</html>
